services:
  skill-manage-test-pg:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: mindmemos
      POSTGRES_PASSWORD: mindmemos
      POSTGRES_DB: skill_manage_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmemos -d skill_manage_test"]
      interval: 2s
      timeout: 5s
      retries: 30
