# Multimodal memory benchmark (MemEye) for vanilla with algo_config.multimodal.mode off / basic / enhanced.
# The mode is set per project through algorithm_profiles.vanilla.project_override_config (this file:
# enhanced). Every configuration is answered by the same VLM (answer_llm) from what search returns:
# text memories plus the images a multimodal search returns. Images are sent by path, so the server
# needs blob_store.allowed_path_roots to cover the dataset directory. For mode off set
# execution_params.memeye.send_images: false (that mode rejects images).
runner:
  base_url: http://127.0.0.1:8000
  timeout_seconds: 3600
  max_conv_concurrency: 8     # tasks built and evaluated in parallel (one project each)
  max_qa_concurrency: 8       # questions answered concurrently within one task
  max_score_concurrency: 8    # OPEN-answer judge calls in flight
  add: true
  score: true
  show_progress: true
  llm:
    model: gpt-4.1-mini
    api_key: your-api-key
    base_url: https://your-base-url/v1
    temperature: 0.0
    timeout: 600
  answer_llm:                 # vision-capable answerer shared by all algorithms
    model: gpt-4.1-mini
    api_key: your-api-key
    base_url: https://your-base-url/v1
  judge_llm:                  # OPEN-answer judge (MemEye rubric)
    model: gpt-4.1-mini
    api_key: your-api-key
    base_url: https://your-base-url/v1

benchmarks:
  memeye:
    dataset: datasets/memeye/data       # holds dialog/ and image/ (HF: MemEyeBench/MemEye)
    default_algorithm: vanilla
    output_root: runs/mindmemos_eval
    # tasks: [Brand_Memory_Test]        # subset of the 8 tasks
    # modes: [mcq, open]

execution_params:
  memeye:
    max_answer_images: 8      # images attached to the answerer (question images first)
    image_max_side: 1024      # images are downscaled to this many pixels on the long side
    send_images: true         # send turn and question images (false for a text-only baseline)
    # max_questions: 3        # smoke test: first N questions per phase

algorithm_profiles:
  vanilla:
    memory_algorithm: vanilla
    project_override_config:
      algo_config:
        multimodal:
          mode: enhanced      # off | basic | enhanced
    search_params:
      top_k: 20                # overrides the runner/CLI default (--top-k) for this benchmark
      rerank: true
      multimodal: true        # search stored images too (ignored while the mode is off)
      # search_strategy: agentic   # enhanced: multimodal agentic retrieval
