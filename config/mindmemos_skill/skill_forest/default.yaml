# Algorithm options for Algorithm.build("skill_forest", options).
# The caller supplies the environment, Skill and materialized training pool.
optimizer:
  model: gpt-5.4-mini
  timeout_s: 21600
  max_retries: 0
  sdk_max_retries: 0
  parse_max_attempts: 1
ensemble_strategy: select
num_trees: 7
train_ratio: 0.5
seed: 42
candidates_per_node: 3
max_depth: 3
expansion_budget: 30
expansion_concurrency: 40
rollout_concurrency: 40
model_concurrency: 40
root_share_train_trajectory: false
min_gain: 0.0
early_rejection: true
merge_batch_size: 8
reflection_minibatch_size: 8
reflection_edit_budget: 4
ranking_enabled: true
ranking_edit_budgets: [4, 3, 2]
merge_threshold: 0.15
env_adapter:
  class_name: generic
  config: {}