# Skill execution uses async model, database, and subprocess APIs end to end.
# Complete built-in Skill service configuration; copy to dev.yaml before starting.
# Agent presets omit default options except timeout_s and max_retries.
# Connection placeholders remain where dev.yaml supplies local credentials.
# Within each config: connections/behavior/concurrency first, advanced tuning/audit last.
# Fill api_key and base_url in each enabled service.agents preset before model calls.
# Replace the embedding model, endpoint and dimensions with values from your provider.
# Each pipeline block is independent: comment out the whole block when not needed.
# Keep training_pipelines: {} / evolution_pipelines: {} if removing all their children;
# alternatively comment out the parent mapping as well. A bare key means null and is invalid.
# When removing simple evolution, also set fastapi.evolution_pipelines: [].
# Environment, tasks, split and initial Skill version are per-request inputs, not service config.
# SpreadsheetBench text-action requires soffice on the system PATH.
# Its managed Python helper calls LibreOffice directly; no UNO or executable-path config is needed.
# Optional implementation alternatives are shown at the end; do not enable both alternatives.
# SpreadsheetBench creates its Python environments under MindMemOS home/envs on initialization.
# SpreadsheetBench text-action supplies an agent-run Python recalculation helper; scoring reads output.xlsx.
# Tool-calling defaults to scoring output.xlsx directly; request environment settings can override either default.
# make dev uses the project .mindmemos directory; no per-environment Python path is configured.
# Task data and environment settings contain no caller-supplied hashes; runtime fingerprints are automatic.
service:
  home: ../../data/mindmemos_skill
  disabled_services: []
  # Algorithm-owned Agent presets; references use <algo>_<llm_name>.
  agents:
    # Optional native harness preset; select it only in callers accepting CLI Agents.
    native_openclaw_custom:
      class_name: openclaw
      config:
        class_name: openclaw
        cli_path: openclaw
        model: your-model-id
        api_key: null
        base_url: null
        api: openai-completions
        reasoning_effort: null
        context_window: 200000
        max_completion_tokens: 8192
        timeout_s: 300.0
        extra_args: []
    skill_forest_gpt_5_4_mini:
      class_name: openai_chat
      config:
        class_name: openai_chat
        model: gpt-5.4-mini
        reasoning_effort: medium
        api_key: null
        base_url: null
        max_completion_tokens: 16384
        timeout_s: 180.0
        max_retries: 3
    treeskill_qwen3_5_thinking:
      class_name: openai_chat
      config:
        class_name: openai_chat
        model: qwen3.5-9b
        api_key: null
        base_url: null
        max_completion_tokens: 16384
        temperature: 1.0
        timeout_s: 1800.0
        max_retries: 3
        top_p: 0.95
        presence_penalty: 1.5
        seed: 41
        extra_body:
          top_k: 20
          min_p: 0.0
          repetition_penalty: 1.0
          chat_template_kwargs:
            enable_thinking: true
    treeskill_qwen3_5_fast:
      class_name: openai_chat
      config:
        class_name: openai_chat
        model: qwen3.5-9b
        api_key: null
        base_url: null
        max_completion_tokens: 16384
        temperature: 1.0
        timeout_s: 600.0
        max_retries: 3
        top_p: 1.0
        presence_penalty: 2.0
        seed: 41
        extra_body:
          top_k: 40
          min_p: 0.0
          repetition_penalty: 1.0
          chat_template_kwargs:
            enable_thinking: false
    simple_evolve_gpt_5_4_mini:
      class_name: openai_chat
      config:
        class_name: openai_chat
        model: gpt-5.4-mini
        api_key: null
        base_url: null
        timeout_s: 180.0
        max_retries: 3

    skill_manage_deepseek_v4_flash:
      class_name: openai_chat
      config:
        class_name: openai_chat
        model: deepseek-v4-flash
        max_completion_tokens: 32768
        timeout_s: 1200.0
        sdk_max_retries: 0
        base_url: https://api.openai.com/v1
        api_key: null
  persistence:
    config:
      prefixed_ids: true
    database:
      class_name: postgres
      config:
        url: postgresql+psycopg://mindmemos_skill:mindmemos_dev_password@localhost:55432/mindmemos_skill
        pool_size: 20
        max_overflow: 10
        pool_timeout: 30.0

  # Repository operations; this implementation has no additional config fields.
  repository_pipeline:
    class_name: repository
    config: {}

  # Graph queries, organization and recommendation. Comment out this block to disable all.
  # Supply model credentials for construction and recommendation; stored queries need no model calls.
  manage_pipeline:
    class_name: graph_manage
    config:
      scene_concurrency: 4
      algorithm:
        embedding:
          class_name: openai_embedding
          model: qwen3-embedding-4b
          base_url: https://api.openai.com/v1
          api_key: null
          dimensions: 2560
          send_dimensions: false
          batch_size: 64
          timeout_s: 180
          max_retries: 3
        embedding_profile: null
        chat: skill_manage_deepseek_v4_flash
        build_scene: true
        scene_flow_weight: 0.3
        llm_linking: true
        scene_llm_linking: false
        query_rewrite: false
        enrich_skill: false
        enrichment_concurrency: 4
        enrichment_failure: error
        mode: separate
        scene_ppr: true
        fusion_lambda: 0.5
        scene_count_damp: 0
        scene_uniqueness: 0
        dependency_filter: none
        dependency_hub_fraction: 0.05
        dependency_top_k: 10
        skill_candidates: 20
        scene_candidates: 20
        skill_seeds: 5
        scene_seeds: 5
        alpha: 0.5
        aggregation: max
        score_threshold: -1
        damping: 0.2
        max_iter: 50
        tolerance: 0.000001
        max_input_chars: 1000000
        llm_batch_size: 32
        joint_linking:
          candidate_strategy: rrf
          dense_candidates: 20
          lexical_candidates: 20
          io_candidates: 20
          max_candidates: 20
          model_candidates: 8
          relation_weighting: type_confidence
          relation_validation: strict
          dependency_match_threshold: 0.6

  # Select a named trainer through TrainingRequest.algo; comment out either child independently.
  training_pipelines:
    # Skill-Forest: expansion_budget is global and must be at least num_trees.
    skill_forest:
      class_name: training
      config:
        trainer:
          class_name: skill_forest
          config:
            optimizer: skill_forest_gpt_5_4_mini
            ensemble_strategy: select
            num_trees: 7
            train_ratio: 0.5
            seed: 42
            candidates_per_node: 3
            max_depth: 3
            expansion_budget: 7
            expansion_concurrency: 12
            rollout_concurrency: 12
            model_concurrency: 12
            min_gain: 0.0
            early_rejection: true
            validation_batch_size: 8
            selection_tiebreak: novelty
            patch_application: exact
            reflection_minibatch_size: 8
            reflection_edit_budget: 4
            ranking_enabled: true
            ranking_edit_budgets:
            - 4
            - 3
            - 2
            merge_batch_size: 8
            merge_threshold: 0.15
            root_share_train_trajectory: false
            root_share_validation: true
            cleanup_workspaces: true
        evaluation_concurrency: 12

    # TreeSkill: optimizer analyzes/fuses; router selects task-specific subtrees.
    # failure_optimizer is explicit here; set it to null to reuse optimizer settings.
    # spreadsheetbench_text_action supplies the agent-run Python recalculation helper; scoring reads output.xlsx.
    treeskill:
      class_name: training
      config:
        trainer:
          class_name: treeskill
          config:
            optimizer: treeskill_qwen3_5_thinking
            failure_optimizer: treeskill_qwen3_5_fast
            samples_per_task: 1
            rollout_concurrency: 16
            min_trajectories: 1
            max_trajectories: 200
            annotation_mode: required
            require_skill_match: true
            success_score_threshold: 1.0
            analysis_concurrency: 16
            analysis_temperature: 1.0
            analysis_max_tokens: 16384
            analysis_max_turns: 100
            shell_timeout_seconds: 120
            transcript_max_chars: 20000
            localization_concurrency: 16
            localization_temperature: 0.0
            localization_max_tokens: 16384
            fusion_temperature: 0.0
            fusion_max_tokens: 16384
            router: treeskill_qwen3_5_fast
            routing_temperature: 0.0
            routing_max_tokens: 16384
            algorithm_version: '1'
            prompt_version: treeskill-v1
        evaluation_concurrency: 16
  evolution_pipelines:
    simple:
      class_name: simple_evolution
      config:
        evolver:
          class_name: simple_evolve
          config:
            optimizer: simple_evolve_gpt_5_4_mini
            batch_size: 8
            concurrency: 5
            user_message_chars: 60000
            assistant_message_chars: 12000
            tool_message_chars: 6000
            max_skill_chars: 100000
            max_edits: 5
        work_dir: ./output/skill_evolution
        traj_collect:
          sample_size: 40
          trajectory_limit: 100
          max_page_size: 200
          seed: null

  # Background execution. Use mode: local for in-process tasks, or comment out to disable.
  task_manager:
    mode: kafka
    bootstrap_servers: localhost:9092
    topic: skill.train.jobs
    group_id: mindmemos-skill-workers
    worker: true
    max_concurrency: 2
    max_buffered: 1000
    scan_interval_seconds: 5.0

  # SQL run state and OTLP export. Either sink can be null; at least one must remain.
  observability:
    backend:
      class_name: postgres
      config:
        url: postgresql+psycopg://mindmemos_skill:mindmemos_dev_password@localhost:55432/mindmemos_skill
        pool_size: 20
        max_overflow: 10
        pool_timeout: 30.0
    otlp:
      endpoint: http://localhost:4318/
      timeout: 5.0
    capture_level: info
    service_name: mindmemos-skill

# HTTP access policy. The default unauthenticated mode permits loopback listening only.
fastapi:
  auth:
    mode: none
    # For local/gateway_jwt modes, set default_project_id: null.
    default_project_id: personal
    # For mode: local, supply the project/API-key YAML path.
    api_key_file: null
    # For mode: gateway_jwt, supply the shared secret; otherwise leave null.
    gateway_jwt_secret: null
    gateway_jwt_issuer: mindmemos-gateway
    gateway_jwt_audience: memory-data-plane

  # Allow HTTP evolution only for these configured names; use [] after removing simple.
  evolution_pipelines:
  - simple

# Alternative database (replace persistence.database; also supported by observability.backend):
# class_name: sqlite
# config:
#   url: sqlite+aiosqlite:///./data/mindmemos_skill/central.db
#   timeout: 5.0
# PostgreSQL fields pool_size/max_overflow/pool_timeout do not apply to SQLite.
