version: 1
method: skill_evaluation
environment: officeqa
launcher:
  env_file: .skill.env
parameters:
  dataset:
    data_root: data/mindmemos_skill/officeqa
    split_dir: resources/mindmemos_skill/datasets/officeqa/splits
    skill: resources/mindmemos_skill/skills/officeqa/SKILL.md
  models:
    target_model: openai/gpt-5.4-mini
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
  evaluation:
    test_rollouts: 1
    seed: 0
  rollout:
    max_concurrent_rollouts: 16
    rollout_retries: 1
  environment_options:
    max_turns: 24
    docs_root: data/mindmemos_skill/officeqa/officeqa_docs_official
    env_options:
      search_mode: offline
      max_queries_per_turn: 4
      search_api_base_url_env: OFFICEQA_SERPAPI_BASE_URL
      search_api_key_env: OFFICEQA_SERPAPI_API_KEY
      search_api_protocol_env: OFFICEQA_SERPAPI_PROTOCOL
      search_max_num_results: 4
      search_timeout_seconds: 20
