version: 1
method: skill_evaluation
environment: spreadsheetbench
launcher:
  env_file: .skill.env
parameters:
  runtime:
    run_id: spreadsheetbench_best_skill_answer_position_rollout3_{timestamp}
  dataset:
    data_root: data/mindmemos_skill/spreadsheetbench
    split_dir: resources/mindmemos_skill/datasets/spreadsheetbench/splits
    skill: outputs/spreadsheetbench/skill_grpo_with_experience_validation/spreadsheetbench_skill_grpo_alfworld_matched_v1_trunc24000_20260815-102838/final_skill.md
  models:
    target_model: openai/gpt-5.4-mini
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
  evaluation:
    test_rollouts: 3
    seed: 0
  rollout:
    max_concurrent_rollouts: 8
    rollout_retries: 1
  environment_options:
    max_turns: 30
    shell_timeout: 120
    env_options:
      expose_answer_position: true
