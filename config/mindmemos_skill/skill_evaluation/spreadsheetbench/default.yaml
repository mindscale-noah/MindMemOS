version: 1
method: skill_evaluation
environment: spreadsheetbench
launcher:
  env_file: .skill.env
parameters:
  dataset:
    data_root: data/mindmemos_skill/spreadsheetbench
    split_dir: resources/mindmemos_skill/datasets/spreadsheetbench/splits
    skill: resources/mindmemos_skill/skills/spreadsheetbench/SKILL.md
  models:
    target_model: openai/gpt-5.4-mini
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
  evaluation:
    test_rollouts: 3
    seed: 0
  rollout:
    max_concurrent_rollouts: 16
    queue_capacity: 16
    rollout_retries: 1
  environment_options:
    max_turns: 30
    shell_timeout: 120
