version: 1
method: tree_skill_grpo
environment: spreadsheetbench
launcher:
  env_file: .skill.env
parameters:
  dataset:
    data_root: data/mindmemos_skill/spreadsheetbench
    split_dir: resources/mindmemos_skill/datasets/spreadsheetbench/splits
    initial_skill: resources/mindmemos_skill/skills/spreadsheetbench/SKILL.md
  models:
    target_model: openai/gpt-5.4-mini
    optimizer_model: openai/gpt-5.4-mini
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
  training:
    epochs: 4
    batch_size: 40
    max_task_attempts: 4
    max_concurrency: 32
    seed: 0
  evaluation:
    test_rollouts: 1
  rollout:
    max_concurrent_rollouts: 32
    rollout_retries: 1
  environment_options:
    max_turns: 30
    shell_timeout: 120
