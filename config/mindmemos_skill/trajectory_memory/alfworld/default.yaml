version: 1
method: trajectory_memory
environment: alfworld
launcher:
  env_file: .skill.env
parameters:
  dataset:
    data_root: data/mindmemos_skill/alfworld
    split_dir: resources/mindmemos_skill/datasets/alfworld/splits
    initial_skill: resources/mindmemos_skill/skills/alfworld/SKILL.md
  models:
    target_model: openai/gpt-5.4-mini
    summary_model: openai/gpt-5.4-mini
    embedding_model: openai/text-embedding-3-small
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
    summary_max_completion_tokens: 2048
  experiment:
    top_k: 3
    train_rollouts: 1
    test_rollouts: 1
    run_baseline: true
  rollout:
    max_concurrent_rollouts: 32
    max_concurrent_summaries: 8
    rollout_retries: 1
  environment_options:
    max_turns: 50
    env_seed: 42
