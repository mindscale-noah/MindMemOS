version: 1
method: task_virtual_skill
environment: spreadsheetbench
launcher:
  env_file: .skill.env
parameters:
  dataset:
    data_root: data/mindmemos_skill/spreadsheetbench
    split_dir: resources/mindmemos_skill/datasets/spreadsheetbench/splits
    initial_skill: resources/mindmemos_skill/skills/spreadsheetbench/SKILL.md
  models:
    target_model: openai/gpt-5.4-mini
    summary_model: openai/gpt-5.4-mini
    decomposition_model: openai/gpt-5.4-mini
    reflection_model: openai/gpt-5.4-mini
    change_model: openai/gpt-5.4-mini
    merge_model: openai/gpt-5.4-mini
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
    summary_max_completion_tokens: 2048
  batch:
    batch_size: 40
    train_rollouts: 1
    seed: 0
  summary:
    summary_sample_size: 20
    max_concurrent_summaries: 8
    transcript_max_chars: 24000
  rollout:
    max_concurrent_rollouts: 16
    rollout_retries: 1
    fail_fast: false
  environment_options:
    max_turns: 30
    shell_timeout: 120
  algorithm:
    max_virtual_skills: 12
    max_initial_components: 3
  refinement:
    retry_rounds: 1
    success_reward: 1.0
    max_concurrent_reflections: 8
    max_trajectory_chars: 24000
    max_previous_answer_chars: 8000
    max_reflection_chars: 4000
    max_concurrent_changes: 8
    max_concurrent_merges: 4
