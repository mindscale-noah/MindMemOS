version: 1
method: treeskill
environment: spreadsheetbench
launcher:
  env_file: .skill.env
parameters:
  dataset:
    data_root: data/mindmemos_skill/spreadsheetbench
    split_dir: resources/mindmemos_skill/datasets/spreadsheetbench/trace2skill_200_200/splits
    initial_skill: data/mindmemos_skill/authorized_skills/xlsx
  models:
    target_model: openai/Qwen/Qwen3.5-35B-A3B
    optimizer_model: openai/Qwen/Qwen3.5-35B-A3B
    reasoning_effort: ""
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
    target_generation_config: config/mindmemos_skill/treeskill/spreadsheetbench/qwen3.5_instruct.json
    optimizer_generation_config: config/mindmemos_skill/treeskill/spreadsheetbench/qwen3.5_thinking.json
  evolution:
    train_limit: 200
    collection_rollouts: 1
    min_trajectories: 1
    max_trajectories: 200
    transcript_max_chars: 20000
    annotation_mode: required
    require_skill_match: true
    success_score_threshold: 1.0
    analysis_adapter: spreadsheetbench_reference
    analysis_concurrency: 128
    localization_concurrency: 16
    analysis_temperature: 1.0
    localization_temperature: 0.0
    fusion_temperature: 0.0
    analysis_max_tokens: 16384
    analysis_max_turns: 20
    localization_max_tokens: 2048
    fusion_max_tokens: 4096
  routing:
    tree_router_temperature: 0.0
    tree_router_max_tokens: 512
  evaluation:
    test_rollouts: 1
    test_limit: 200
  rollout:
    max_concurrent_rollouts: 16
    rollout_retries: 1
    seed: 41
  environment_options:
    max_turns: 100
    shell_timeout: 120
    transactional_recalculation: true
    trace2skill_reference_mode: true
