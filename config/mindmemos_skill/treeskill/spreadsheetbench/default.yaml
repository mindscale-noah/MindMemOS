version: 1
method: treeskill
environment: spreadsheetbench
launcher:
  env_file: .skill.env
parameters:
  dataset:
    data_root: data/mindmemos_skill/spreadsheetbench
    split_dir: resources/mindmemos_skill/datasets/spreadsheetbench/splits
    initial_skill: resources/mindmemos_skill/skills/spreadsheetbench/SKILL.md
  models:
    target_model: openai/gpt-5.4-mini
    optimizer_model: openai/gpt-5.4-mini
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
  evolution:
    train_limit: 8
    collection_rollouts: 1
    min_trajectories: 8
    max_trajectories: 8
    transcript_max_chars: 20000
    annotation_mode: required
    require_skill_match: true
    success_score_threshold: 1.0
    analysis_concurrency: 8
    localization_concurrency: 8
    analysis_temperature: 1.0
    localization_temperature: 0.0
    fusion_temperature: 0.0
    analysis_max_tokens: 4096
    localization_max_tokens: 2048
    fusion_max_tokens: 4096
  routing:
    tree_router_temperature: 0.0
    tree_router_max_tokens: 512
  evaluation:
    test_rollouts: 1
  rollout:
    max_concurrent_rollouts: 8
    rollout_retries: 1
    seed: 0
  environment_options:
    max_turns: 30
    shell_timeout: 120
