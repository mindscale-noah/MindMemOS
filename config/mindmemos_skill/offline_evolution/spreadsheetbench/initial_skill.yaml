version: 1
method: offline_evolution
environment: spreadsheetbench
launcher:
  env_file: .skill.env
  extra_dependencies: [offline-evolution]
parameters:
  dataset:
    data_root: data/mindmemos_skill/spreadsheetbench
    split_dir: resources/mindmemos_skill/datasets/spreadsheetbench/splits
    initial_skill: resources/mindmemos_skill/skills/spreadsheetbench/xlsx/SKILL.md
  models:
    target_model: openai/gpt-5.4-mini
    optimizer_model: openai/gpt-5.4-mini
    reasoning_effort: medium
    request_timeout: 1800
    model_retries: 3
    max_completion_tokens: 16384
  offline_evolution:
    backend: react
    scope_name: default
    train_limit: 80
    collection_rollouts: 1
    min_trajectories: 40
    max_trajectories: 80
  evaluation:
    test_rollouts: 1
    test_limit: 280
  rollout:
    max_concurrent_rollouts: 32
    rollout_retries: 1
    seed: 0
  environment_options:
    max_turns: 30
    shell_timeout: 120
