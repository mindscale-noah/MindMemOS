# Environment options; Skill-Forest workspace ReAct actor configuration.
interaction_mode: workspace_tools
tool_agent: openai_tool
skill_loading_mode: tool
max_turns: 30
stagnation_limit: null
agent:
  model: gpt-5.4-mini
  max_completion_tokens: 16384
  reasoning_effort: medium
  temperature: null
  timeout_s: 600
  sdk_max_retries: 2
  max_retries: 5
  retry_initial_wait_s: 2
  retry_max_wait_s: 30
  retry_wait: equal_jitter
  response_validation: content
  invalid_tool_arguments: empty
execution:
  timeout_s: 120
