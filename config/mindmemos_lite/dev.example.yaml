observability:
  enabled: true
  service_name: mindmemos-lite
  exporter: sqlite
  sqlite_path: ${oc.env:MINDMEMOS_TRACE_DB,.mindmemos/observability/traces.db}
  otlp_endpoint: null
  trace_sampling_ratio: 1.0
  max_queue_size: 2048
  max_export_batch_size: 128
  schedule_delay_millis: 1000
  export_timeout_millis: 5000
  retention_days: 14
  capture_content: false

chat_model_router:
  endpoints:
    - model: openai/gpt-4.1-mini
      api_base: https://your-base-url/v1
      api_key: your-api-key
      rpm: null
      tpm: null
      timeout: 1200
      num_retries: 3
      temperature: 0.0
      top_p: null
      max_tokens: null
      max_completion_tokens: null
      encoding_format: null
      dimensions: null
      extra_body: {}
  routing_strategy: simple-shuffle
  allowed_fails: null
  cool_down: null
  format_parser_max_attempts: 3
  dimensions_supported_models: []

embed_model_router:
  endpoints:
    - model: openai/qwen3-embedding-4b
      api_base: https://your-base-url/v1
      api_key: your-api-key
      rpm: null
      tpm: null
      timeout: 600
      num_retries: 3
      temperature: null
      top_p: null
      max_tokens: null
      max_completion_tokens: null
      encoding_format: null
      dimensions: 2560
      extra_body: {}
  routing_strategy: simple-shuffle
  allowed_fails: null
  cool_down: null
  format_parser_max_attempts: 3
  dimensions_supported_models: []

rerank_model_router:
  endpoints:
    - model: cohere/qwen3-reranker-4b
      api_base: https://your-base-url/v1/rerank
      api_key: your-api-key
      rpm: null
      tpm: null
      timeout: 600
      num_retries: 3
      temperature: null
      top_p: null
      max_tokens: null
      max_completion_tokens: null
      encoding_format: null
      dimensions: null
      extra_body: {}
  routing_strategy: simple-shuffle
  allowed_fails: null
  cool_down: null
  format_parser_max_attempts: 3
  dimensions_supported_models: []

database:
  default_consistency: fast
  backend:
    provider: pgvector
    graph_enabled: true
    required:
      dense_vector: true
      sparse_vector: true
      hybrid_search: true
      metadata_filtering: true
      batch_record_io: true
      atomic_batch_write: false
      max_vector_dimensions: 2560

  pgvector:
    # Keep credentials in the environment rather than committing them.
    dsn: ${oc.env:PGVECTOR_DSN,postgresql://postgres:postgres@127.0.0.1:5432/mindmemos}
    schema: ${oc.env:PGVECTOR_SCHEMA,mindmemos}
    min_pool_size: 1
    max_pool_size: 10
    pool_timeout: 30
    create_extension: true
    create_schema: true
    # Fallback for generic hybrid queries; Vanilla passes explicit channel limits.
    hybrid_prefetch_factor: 4
    rrf_k: 2
    dense_weight: 1.0
    sparse_weight: 1.0

pipelines:
  # Inferred adds run the trajectory task+experience pipeline by default and
  # therefore require a non-empty `task` on each add request.
  default_add_pipeline: trajectory_add
  # Search treats the query as a task text and returns that task's experiences.
  # Configure vanilla_search for a generic hybrid search, or mode_search for
  # request-time memory_mode routing.
  default_search_pipeline: task_experience_search
  default_search_mode: vanilla
  modes:
    vanilla:
      add_pipeline: vanilla_add
      search_pipeline: vanilla_search
  mixed_add:
    modes:
      - vanilla

algo_config:
  text_processing:
    unicode_normal_form: NFKC
    strip_zero_width_chars: true
    normalize_whitespace: true
    normalize_lowercase: false
    whitespace_regex: "\\s+"
    strip_text: true
    spacy_en_model: en_core_web_sm
    spacy_zh_model: zh_core_web_sm
    content_hash_algorithm: md5
    explicit_language_confidence: 1.0
    lang_zh_ratio: 0.35
    lang_en_latin_ratio: 0.5
    lang_mixed_zh_ratio: 0.35
    lang_mixed_latin_ratio: 0.15
    jieba_cut_all: false
    bm25_min_term_len: 1
    bm25_drop_punctuation: true
    bm25_lowercase_en: true
    bm25_use_spacy_lemma: true
    bm25_en_regex_pattern: "[A-Za-z][A-Za-z0-9_+-]*"
    bm25_use_stem_fallback: true
    bm25_stemmer_name: porter
    sparse_hash_dim: 2000000
    sparse_hash_algorithm: sha1
    sparse_k1: 1.5
    sparse_b: 0.75
    sparse_fallback_mode: log_tf
    sparse_bm25_model_name: hash_bm25_v1
    sparse_fallback_model_name: hash_sparse_tf_v1
    bm25_idf_smoothing: 0.5
    bm25_min_idf_denominator: 1.0e-9
    bm25_min_avg_doc_len: 1.0
    entity_fallback_on_empty: true
    spacy_entity_default_confidence: 1.0
    rule_entity_default_confidence: 0.6
    max_entity_count: 64
    rule_zh_min_term_len: 2
    entity_rule_find_quoted_text: true
    entity_rule_find_title_case: true
    entity_rule_find_acronyms: true
    entity_rule_find_file_paths: true
    entity_rule_find_code_identifiers: true
    entity_rule_find_book_titles: true
    entity_rule_find_english_terms: true
    entity_rule_find_long_jieba_terms: true
    stopwords_zh_path: null
    stopwords_en_path: null
    nlp_max_retries: 50
    nlp_retry_base_delay: 0.1

  add:
    enable_entities: false
    embedding_batch_size: 32
    chunker:
      chunk_soft_token_budget: 26000
      chunk_hard_token_budget: 32000
      turn_hard_token_budget: 16000
      history_soft_token_budget: 2000
      history_hard_token_budget: 4000
      history_min_turn_count: 1
      compaction_soft_token_budget: 16000
      compaction_head_tokens: 4000
      compaction_tail_tokens: 4000
      compaction_summary_context_token_budget: 200000
      compaction_summary_output_token_budget: 8000
      time_gap_threshold_seconds: 1800
      template_tokens: 1000
      recall_budget: 2000
      output_headroom: 4000
    recall:
      top_k: 5
      scan_limit: 100
      fusion_k: 60
      fusion_weight_semantic: 1.5
      fusion_weight_bm25: 1.0
      fusion_weight_entity: 1.2
      fusion_weight_recent: 0.5
      fusion_weight_schema_property: 2.0
    safety_gate:
      min_content_chars: 1
      min_update_confidence: 0.7
      min_merge_confidence: 0.8

  trajectory:
    experience_recall_top_k: 5
    embedding_batch_size: 32
    min_content_chars: 1
    enable_task_entity_embedding: true
    task_search_score_threshold: 0.45

  search:
    recall_size: 20
    hybrid_prefetch_factor: 3
    hybrid_prefetch_min: 30
    hybrid_prefetch_max: 300
    use_reranker: true
    dedup_enabled: true
    dedup_threshold: 0.6
    dedup_max_candidates: 128
    graph_enabled: false
    shared_entity_graph_enabled: false
    graph_seed_memory_limit: 5
    graph_related_per_seed: 3
    shared_entity_graph_limit_per_entity: 3
    graph_max_candidates: 10
    graph_decay: 0.5
    graph_score: 0.01

  dreaming:
    lookback_days: 7
    max_scopes_per_run: null
    max_seed_memories: null
    max_memories_per_scope: 40
    min_scope_updates: 1
    min_cluster_size: 2
    max_entity_memory_count: 50
    concurrency: 8
    consolidation_model: null
    scope_batch_size: 2000
