[project]
name = "mindmemos-skill"
version = "0.1.0"
description = "Skill components for MindMemOS"
readme = "README.md"
authors = []
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
alfworld = [
    "alfworld>=0.4.0",
    "pyyaml>=6.0",
]
dataset-download = [
    "alfworld>=0.4.0",
    "huggingface-hub>=0.34.0",
]
llm = [
    "litellm>=1.85.0",
]
pgvector = [
    "psycopg[binary,pool]>=3.2",
]
claude-sdk = [
    "claude-agent-sdk>=0.1.0",
]
spreadsheetbench = [
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
