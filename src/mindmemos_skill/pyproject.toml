[project]
name = "mindmemos-skill"
version = "0.0.1"
description = "Skill package for MindMemOS"
readme = "README.md"
authors = []
requires-python = ">=3.11,<3.14"
dependencies = [
    "mindmemos-sdk>=0.1.4",
    "filelock>=3,<4",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "tenacity>=9,<10",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<2.1",
    "sqlite-vec>=0.1.6,<0.2",
]

[project.optional-dependencies]
spreadsheetbench = ["openpyxl>=3.1,<4", "pandas>=2,<3"]
alfworld = ["alfworld>=0.4,<0.5"]
postgres = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
fastapi = ["fastapi>=0.136.1", "uvicorn>=0.47.0"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
