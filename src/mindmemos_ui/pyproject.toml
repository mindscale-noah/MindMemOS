[project]
name = "mindmemos-ui"
version = "0.1.0"
description = "Local MindMemOS skill workbench"
requires-python = ">=3.11,<3.14"
dependencies = ["mindmemos-skill>=0.0.1", "mindmemos-sdk>=0.1.4", "fastapi>=0.136.1", "uvicorn>=0.47.0", "python-dotenv>=1,<2"]

[project.scripts]
mindmemos-ui = "mindmemos_ui.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
